<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TILBIL</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #7a0000, #b30000);
  color: white;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  font-weight: bold;
}

/* PHONE MOCKUP */
.phone {
  width: 200px;
  margin: 20px auto;
}

.phone img {
  width: 100%;
  border-radius: 25px;
}

/* CARDS */
.card {
  background: linear-gradient(135deg, #b30000, #ff1a1a);
  margin: 15px;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.card h2 {
  margin: 0;
}

.card p {
  opacity: 0.9;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  background: gold;
  color: black;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}

/* BOTTOM NAV */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
}

.nav div {
  color: gold;
}
</style>

</head>

<body>

<div class="header">
  <div>👑 TILBIL</div>
  <div>🔔</div>
</div>

<div class="phone">
  <!-- LOGO -->
  <img src="IMG_5467.jpeg" class="logo">
</div>

<div class="card">
  <h2>AI Tutor</h2>
  <p>Explains texts in a simple way</p>
  <a href="#" class="btn">Open</a>
</div>

<div class="card">
  <h2>EduTok Videos</h2>
  <p>Short educational videos</p>
  <a href="#" class="btn">Watch</a>
</div>

<div class="card">
  <h2>Library</h2>
  <p>Useful study materials</p>
  <a href="#" class="btn">Open</a>
</div>

<div class="nav">
  <div>🏠</div>
  <div>🔍</div>
  <div>👤</div>
</div>

</body>
</html>
