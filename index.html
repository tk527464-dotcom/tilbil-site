<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TILBIL</title>

<style>
body {
    margin: 0;
    background: #8B0000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial;
}

/* Телефон */
.phone {
    width: 320px;
    height: 650px;
    background: black;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
}

/* Верх */
.header {
    color: gold;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

/* Контент */
.content {
    padding: 15px;
}

/* Карточки */
.card {
    background: linear-gradient(135deg, #a00000, #6b0000);
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 15px;
    color: white;
    box-shadow: 0 0 15px rgba(255,215,0,0.3);
}

/* Кнопка */
.btn {
    background: gold;
    color: black;
    border: none;
    padding: 8px 15px;
    border-radius: 10px;
    margin-top: 10px;
}

/* Нижнее меню */
.nav {
    position: absolute;
    bottom: 0;
    width: 320px;
    background: #111;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    color: gold;
}
</style>

</head>
<body>

<div class="phone">

    <div class="header">
        <div>👑 TILBIL</div>
        <div>🔔</div>
    </div>

    <div class="content">

        <div class="card">
            <h3>AI-Тьютор</h3>
            <p>Объясняет тексты просто</p>
            <button class="btn">Открыть</button>
        </div>

        <div class="card">
            <h3>EduTok Видео</h3>
            <p>Короткие обучающие видео</p>
            <button class="btn">Смотреть</button>
        </div>

        <div class="card">
            <h3>Справочник</h3>
            <p>Полезные материалы</p>
            <button class="btn">Открыть</button>
        </div>

    </div>

    <div class="nav">
        <div>🏠</div>
        <div>🔍</div>
        <div>👤</div>
    </div>

</div>

</body>
</html>
